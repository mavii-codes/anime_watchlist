name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Test
        run: npm test
        env:
          # Optional: set this repo secret to run the backend integration
          # suite against Neon in CI. Without it, integration tests skip
          # gracefully and the rest of the suite still runs.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
